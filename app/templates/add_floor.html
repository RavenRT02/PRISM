<!DOCTYPE html>
<html>

<head>
    <title>Add Floor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/add_floor.css') }}">
</head>

<body>

<div class="container">

    <h2>Add Floor</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>Select Building</label>

        <select name="building_id" required>

            <option value="">-- Select Building --</option>

            {% for building in buildings %}
                <option value="{{ building.id }}">
                    {{ building.name }}
                </option>
            {% endfor %}

        </select>

        <label>Floor Number</label>

        <input type="text" name="number" required>

        <label class="checkbox-label">
            <input type="checkbox" name="is_active" checked>
            Active
        </label>

        <button type="submit">
            Add Floor
        </button>

    </form>

    <h3 id="floorListTitle">Existing Floors</h3>

    <div class="floor-list" id="floorListContainer">
        <ul>

            {% for floor in floors %}
            <li data-building="{{ floor.building_id }}">
                {{ floor.number }}
            </li>
            {% endfor %}

        </ul>
    </div>

</div>

<script src="{{ url_for('static', filename='js/add_floor.js') }}"></script>

</body>

</html>
