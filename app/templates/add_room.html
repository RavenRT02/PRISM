{% extends "base.html" %}

{% block title %}Add Room | PRISM{% endblock %}
{% block page_title %}Add Room{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto mt-4">
        <div class="custom-card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h5 class="mb-0 fw-bold font-outfit text-dark"><i class="fa-solid fa-door-open me-2 text-primary"></i> Add New Room</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">Select Building</label>
                        <select name="building_id" id="buildingSelect" class="form-select form-select-lg bg-light border-0" required>
                            <option value="">-- Choose a Building --</option>
                            {% for building in buildings %}
                                <option value="{{ building.id }}">{{ building.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">Select Floor</label>
                        <select name="floor_id" id="floorSelect" class="form-select form-select-lg bg-light border-0" required disabled>
                            <option value="">-- Choose Building First --</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">Room Name / Number</label>
                        <input type="text" name="name" class="form-control form-control-lg bg-light border-0" required placeholder="e.g. Room 101, Computer Lab, Conference Room">
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" role="switch" name="is_active" id="isActive" checked>
                        <label class="form-check-label text-muted" for="isActive">Active (Visible to users)</label>
                    </div>
                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm fw-semibold">Submit Room</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
             <a href="{{ url_for('org_setup.manage_rooms') }}" class="text-muted small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to rooms list</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const buildingSelect = document.getElementById("buildingSelect");
    const floorSelect = document.getElementById("floorSelect");

    // If building is already selected (e.g. from a validation failure retaining form data)
    if(buildingSelect.value) {
        floorSelect.disabled = false;
    }

    buildingSelect.addEventListener("change", function() {
        const buildingId = this.value;
        floorSelect.innerHTML = '<option value="">-- Loading Floors... --</option>';
        floorSelect.disabled = true;
        
        if (!buildingId) {
            floorSelect.innerHTML = '<option value="">-- Choose Building First --</option>';
            return;
        }

        fetch(`{{ url_for('issues.get_floors', building_id=0) }}`.replace('0', buildingId))
            .then(response => response.json())
            .then(data => {
                floorSelect.innerHTML = '<option value="">-- Choose a Floor --</option>';
                if(data.length === 0) {
                    floorSelect.innerHTML = '<option value="">-- No Active Floors found --</option>';
                } else {
                    data.forEach(floor => {
                        const option = document.createElement("option");
                        option.value = floor.id;
                        option.textContent = `Floor ${floor.number}`;
                        floorSelect.appendChild(option);
                    });
                    floorSelect.disabled = false;
                }
            })
            .catch(error => {
                console.error("Error fetching floors:", error);
                floorSelect.innerHTML = '<option value="">-- Error Loading Floors --</option>';
            });
    });
});
</script>
{% endblock %}
