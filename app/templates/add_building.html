{% extends "base.html" %}

{% block title %}Add Building | PRISM{% endblock %}
{% block page_title %}Add Building{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto mt-4">
        <div class="custom-card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h5 class="mb-0 fw-bold font-outfit text-dark"><i class="fa-solid fa-building-circle-check me-2 text-primary"></i> Register New Building</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">Building Name</label>
                        <input type="text" name="name" class="form-control form-control-lg bg-light border-0" required placeholder="e.g. Science Block, Dormitory A">
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" role="switch" name="is_active" id="isActive" checked>
                        <label class="form-check-label text-muted" for="isActive">Active (Visible to users raising issues)</label>
                    </div>
                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm fw-semibold">Submit Building</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
             <a href="{{ url_for('org_setup.manage_buildings') }}" class="text-muted small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to buildings list</a>
        </div>
    </div>
</div>
{% endblock %}
