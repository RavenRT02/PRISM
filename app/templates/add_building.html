<!DOCTYPE html>

<html>

<head>
<title>Add Building</title>

<style>

body{
font-family: Arial;
background:#f4f6f9;
}

.container{
width:400px;
margin:auto;
margin-top:100px;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0px 8px 20px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#224abe;
}

input[type="text"]{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:10px;
background:#4e73df;
color:white;
border:none;
border-radius:5px;
}

.message {
padding:10px;
margin-bottom:15px;
border-radius:5px;
text-align:center;
}

.success {
background:#d4edda;
color:#155724;
}

</style>

</head>

<body>

<div class="container">

<h2>Add Building</h2>


{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}

      <div class="message {{ category }}">
        {{ message }}
      </div>

    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST">

<label>Building Name</label>

<input type="text" name="name" required>

<label>
<input type="checkbox" name="is_active" checked>
Active
</label>

<br><br>

<button type="submit">Add Building</button>

</form>

<h3>Existing Buildings</h3>

<ul>
{% for building in buildings %}
  <li>{{ building.name }}</li>
{% endfor %}
</ul>

</div>

</body>

</html>
