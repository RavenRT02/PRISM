{% extends "auth/base_auth.html" %}

{% block title %}Reset Password | PRISM{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle mb-3" style="width: 60px; height: 60px;">
        <i class="fa-solid fa-rotate-left fs-3"></i>
    </div>
    <h5 class="fw-bold text-dark mb-1">Reset Password</h5>
    <p class="text-muted small">Enter your college email address. We will send you an OTP to authorize your password reset.</p>
</div>

<form method="POST" action="{{ url_for('auth.reset_password_start') }}">
    
    <div class="mb-4">
        <label class="form-label text-muted small fw-semibold text-uppercase">Registered Email</label>
        <div class="input-group shadow-sm rounded-3 overflow-hidden">
            <span class="input-group-text bg-light border-0 px-3"><i class="fa-solid fa-envelope text-secondary"></i></span>
            <input type="email" name="email" class="form-control form-control-lg bg-light border-0 px-2 text-dark" placeholder="user@college.edu" required>
        </div>
    </div>
    
    <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow mt-2 mb-3 fs-6">Send Reset OTP</button>
    
    <div class="text-center mt-4">
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none small fw-medium text-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Return to Login</a>
    </div>
</form>
{% endblock %}
